# Producción (Coolify). Solo `web` lleva dominio: Coolify pone delante el proxy
# con SSL. El resto de servicios no publican puertos; se hablan por la red interna.
# Las variables se definen en Coolify → Environment Variables (ver .env.example).
services:
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Konygest}
        NEXT_PUBLIC_SITE_URL: ${APP_URL:?Falta APP_URL}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment: &backend-env
      APP_ENV: production
      DEBUG: "false"
      APP_URL: ${APP_URL:?Falta APP_URL}
      CORS_ORIGINS: ${APP_URL}
      POSTGRES_DB: ${POSTGRES_DB:-konygest}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-konygest}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-konygest}
      DATABASE_APP_URL: postgresql+psycopg://konygest_app:${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-konygest}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
      EMAIL_BACKEND: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@konygest.es}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Konygest}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@klyp.es}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    # Prepara el rol de la API, migra, crea el superadmin (si no existe) y arranca
    command: >
      sh -c "python -m app.db_setup && alembic upgrade head && python -m app.bootstrap &&
      exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000
      --forwarded-allow-ips='*' --access-logfile -"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    command: celery -A app.worker worker --loglevel=INFO --concurrency=2
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konygest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-konygest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konygest} -d ${POSTGRES_DB:-konygest}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


volumes:
  pgdata:
  redisdata:
